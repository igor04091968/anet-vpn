[package]
name = "anet-client-core"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = []
# Включает реальный per-app split tunneling через WinDivert (только Windows).
# Без этой фичи per-app-конфиг игнорируется и клиент работает через TUN.
# Требует наличия WinDivert SDK при сборке (см. anet-appfilter).
per-app = ["anet-appfilter/windivert"]

[dependencies]
sha2 = { workspace = true }
toml = { workspace = true }
serde_json = "1"
tokio-util = { version = "0.7", features = ["rt"] }
hyper = { version = "1.8", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1.19", features = ["client-legacy", "http1", "http2", "tokio"] }
http-body-util = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tower-service = "0.3"

tokio = {workspace = true}
rustls = {workspace = true }
log = {workspace = true}
anyhow = {workspace = true}
prost = {workspace = true}
bytes = {workspace = true}
quinn = {workspace = true }
rustls-pemfile = {workspace = true}
rand = { workspace = true }
x25519-dalek = {workspace = true}
ed25519-dalek = {workspace = true}
base64 = {workspace = true}
serde = { workspace = true, features = ["derive"] }
async-trait = { workspace = true }
ipnet = { workspace = true }
futures = { workspace = true }
tokio-tungstenite = { workspace = true }
http = { workspace = true }

reqwest = { workspace = true, features = ["json", "rustls-tls-webpki-roots", "http2"] }

russh = { workspace = true }
zip = "8.6.0"

hickory-resolver = { version = "0.24", features = ["tokio"] }
anet-common = { path = "../anet-common" }


# Platform-specific dependencies for route management
[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
net-route = "0.4"

# netdev is needed on all desktop platforms for interface discovery
[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
netdev = { workspace = true }

# Per-app split tunneling — только Windows (WinDivert).
# Заглушка по умолчанию; реальный WinDivert включается фичей `per-app`.
[target.'cfg(windows)'.dependencies]
anet-appfilter = { path = "../anet-appfilter" }



[target.'cfg(unix)'.dependencies]
libloading = "0.8.9"

[lib]
path = "src/lib.rs"

[dev-dependencies]
hyper = { version = "1.8", features = ["server"] }
toml = { workspace = true }
